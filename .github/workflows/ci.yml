name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  # nltk (used by llama-index) refuses to open hardlinked files; uv hardlinks from its cache by default.
  UV_LINK_MODE: copy
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-qwen2
      - run: uv sync --frozen
      - run: uv run pytest -q
